<!doctype html><title>ff-ready</title>
<body style="margin:0;background:#333;color:#fff;font:40px sans-serif">
<button id=b style="position:absolute;left:100px;top:60px;width:400px;height:120px;font-size:40px;background:#c33;color:#fff"
 onclick="document.body.style.background='#2a2';b.style.background='#2a2';document.title='ff-clicked'">Click me</button>
<select id=s style="position:absolute;left:100px;top:260px;width:400px;font-size:40px" onchange="document.title='ff-select='+s.value">
 <option value=one>one</option><option value=two>two</option><option value=three>three</option></select>
<p style="position:absolute;top:400px;left:100px">hover/click test</p>
</body>
